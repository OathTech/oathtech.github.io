<style>
  :root {
    --ink: #102f28;
    --muted: #4f6660;
    --rule: #c9d6d0;
    --accent: #7a3a14;
    --bg: #f4f8f5;
  }

  html { font-size: 17px; }

  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Sitka Text",
                 Charter, "Bitstream Charter", Cambria, Georgia, serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.65;
    max-width: 38rem;
    margin: 4rem auto;
    padding: 0 1.5rem 6rem;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  .home {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 2rem;
  }

  .home a { color: var(--muted); text-decoration: none; }
  .home a:hover { text-decoration: underline; }

  .home .corner {
    height: 0.7em;
    width: auto;
    color: var(--accent);
    vertical-align: baseline;
    position: relative;
    top: -0.18em;
  }

  .home .corner:first-child { margin-right: 0.1em; }
  .home .corner:last-child { margin-left: 0.1em; }

  header {
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--rule);
  }

  h1 {
    font-size: 2.3rem;
    text-wrap: balance;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.6rem;
    line-height: 1.1;
  }

  .subtitle {
    font-style: italic;
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0;
    text-wrap: balance;
  }

  p { margin: 0 0 1rem; }

  a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 0.5px;
    text-underline-offset: 2px;
  }

  a:hover { text-decoration-thickness: 1.2px; }

  @media (max-width: 600px) {
    html { font-size: 16px; }
    body { margin: 2rem auto; padding: 0 1.2rem 4rem; }
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
